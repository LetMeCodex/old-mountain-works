<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>The Old Mountain Works — physics driving prototype</title>
<style>
  :root { --ink:#1b1f1d; --paper:#efe7d6; --hot:#d4622a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--paper); overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif; color: var(--ink); }
  canvas { display: block; width: 100%; height: 100dvh; touch-action: none; }
  .mono { font-family: 'Courier New', monospace; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(239,231,214,.72); backdrop-filter: blur(1px); z-index: 10; }
  .card { width: min(560px, 90vw); border: 1px solid rgba(27,31,29,.3); background: rgba(239,231,214,.94);
    padding: 32px; box-shadow: 10px 10px 0 rgba(27,31,29,.15); }
  .kicker { font-size: 10px; letter-spacing: .42em; text-transform: uppercase; opacity: .55; }
  h1 { font-size: 44px; line-height: .92; letter-spacing: -.02em; margin-top: 8px; text-transform: uppercase; }
  .card p.desc { margin-top: 16px; max-width: 24rem; font-size: 14px; line-height: 1.6; opacity: .7; }
  dl { margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(27,31,29,.2);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
  dl div { display: flex; justify-content: space-between; }
  dd { font-family: 'Courier New', monospace; }
  .btn { margin-top: 28px; width: 100%; display: flex; justify-content: space-between; align-items: center;
    border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 12px 20px; font-size: 14px; letter-spacing: .3em; text-transform: uppercase; cursor: pointer; }
  .btn:hover { background: var(--hot); border-color: var(--hot); }
  .btn2 { width: 100%; border: 1px solid var(--ink); background: transparent; color: var(--ink);
    padding: 10px 16px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    cursor: pointer; text-align: left; margin-top: 8px; }
  .btn2:hover { background: var(--ink); color: var(--paper); }
  #hud { display: none; position: fixed; top: 14px; left: 16px; z-index: 5;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .85; line-height: 1.9; }
  #hud .rpm { width: 110px; height: 4px; border: 1px solid var(--ink); margin-top: 2px; }
  #hud .rpm i { display: block; height: 100%; background: var(--hot); width: 0; }
  #hud-air { color: var(--hot); }
  #pedals { display: none; position: fixed; bottom: 0; left: 0; right: 0;
    justify-content: space-between; padding: 16px; z-index: 5; }
  #pedals button { height: 90px; width: 110px; border: 2px solid rgba(27,31,29,.5);
    background: rgba(239,231,214,.5); color: var(--ink); font-size: 24px; touch-action: none; }
  #pedals button:active { background: rgba(212,98,42,.25); }
  #pause { display: none; }
  @media (pointer: fine) { #pedals { display: none !important; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div>DIST <span id="hud-dist" class="mono">0 m</span></div>
  <div>SPEED <span id="hud-speed" class="mono">0 km/h</span></div>
  <div>SCORE <span id="hud-score" class="mono">0</span></div>
  <div class="rpm"><i id="hud-rpm"></i></div>
  <div id="hud-air"></div>
</div>

<div id="pedals">
  <button id="pedal-l" aria-label="Reverse / brake">&#9664;</button>
  <button id="pedal-r" aria-label="Throttle">&#9654;</button>
</div>

<div class="overlay" id="title">
  <div class="card">
    <p class="kicker">Field prototype &middot; rev 02</p>
    <h1>The Old<br/>Mountain Works</h1>
    <p class="desc">A one-vehicle suspension test through an unstable range. Every spring,
      contact patch and landing is simulated &mdash; nothing here is animation.</p>
    <dl>
      <div><dt>Throttle</dt><dd>D / &#8594;</dd></div>
      <div><dt>Brake / rev</dt><dd>A / &#8592;</dd></div>
      <div><dt>Restart</dt><dd>R</dd></div>
      <div><dt>Pause</dt><dd>ESC</dd></div>
      <div><dt>Diagnostics</dt><dd>F3</dd></div>
    </dl>
    <button class="btn" id="start-btn"><span>Start run</span><span class="mono">&#8594;</span></button>
  </div>
</div>

<div class="overlay" id="pause">
  <div class="card" style="width:min(340px,86vw)">
    <p class="kicker">Halted</p>
    <button class="btn2" id="resume-btn">Resume</button>
    <button class="btn2" id="restart-btn">Restart run</button>
    <button class="btn2" id="seed-btn">New terrain seed</button>
  </div>
</div>
